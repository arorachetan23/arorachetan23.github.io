<h1>Vision</h1>
<p>Vision is a private, single-user assistant that runs on its owner's own computer. It is not offered to the public and has no other users.</p>
<p>It uses Google sign-in only to read its owner's own Gmail, read-only, for personal tasks such as a spending summary.</p>
